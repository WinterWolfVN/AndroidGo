name: Lay Javax Security Va Crypto API 37

on:
  workflow_dispatch:

jobs:
  clone-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Buoc 1 - Checkout repo cua sep
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buoc 2 - Setup Git ca nhan
        run: |
          git config --global user.name "Github Action"
          git config --global user.email "actions@github.com"

      - name: Buoc 3 - Hut dung javax/security va javax/crypto
        run: |
          mkdir temp_sdk && cd temp_sdk
          git init
          git remote add -f origin https://github.com/AndroidSDKSources/android-sdk-sources-for-api-level-37.0.git
          git config core.sparseCheckout true
          
          # Chỉ lọc đúng 2 gói mở rộng bảo mật sếp cần
          echo "javax/security/" >> .git/info/sparse-checkout
          echo "javax/crypto/" >> .git/info/sparse-checkout
          
          git pull origin master
          cd ..

      - name: Buoc 4 - Ném thẳng vao thu muc javax o goc repo của sếp
        run: |
          # Tạo thư mục javax ngay tại gốc repo
          mkdir -p javax
          
          # Chép sạch sẽ vào
          cp -r temp_sdk/javax/security javax/
          cp -r temp_sdk/javax/crypto javax/
          
          rm -rf temp_sdk
          
          # Commit và đẩy thẳng lên GitHub cho sếp code
          git add javax/
          git commit -m "Pháp sư tinh gọn: Chỉ lấy javax/security và javax/crypto từ API 37 👑"
          git push
