name: Tu Dong Lay Code Java Vao Repo

on:
  workflow_dispatch:
jobs:
  clone-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Buoc 1 - Checkout repo cua sep
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buoc 2 - Setup Git ca nhan
        run: |
          git config --global user.name "Github Action"
          git config --global user.email "actions@github.com"

      - name: Buoc 3 - Hut code tu Google va loc lay 3 thu muc
        run: |
          mkdir temp_sdk && cd temp_sdk
          git init
          git remote add -f origin https://github.com/AndroidSDKSources/android-sdk-sources-for-api-level-37.0.git
          git config core.sparseCheckout true
          
          # Chỉ định đúng 3 thư mục sếp cần
          echo "java/nio/" >> .git/info/sparse-checkout
          echo "java/time/" >> .git/info/sparse-checkout
          echo "java/security/" >> .git/info/sparse-checkout
          
          git pull origin master
          cd ..

      - name: Buoc 4 - Dua thẳng vao thu muc java o goc repo
        run: |
          # Tạo thư mục java ngay tại gốc repo của sếp
          mkdir -p java
          
          # Chép đống nio, time, security vào thẳng mục java này
          cp -r temp_sdk/java/nio java/
          cp -r temp_sdk/java/time java/
          cp -r temp_sdk/java/security java/
          
          # Dọn dẹp
          rm -rf temp_sdk
          
          # Commit và push thẳng lên GitHub cho sếp code
          git add java/
          git commit -m "Pháp sư tinh chỉnh: Đưa nio, time, security vào đúng package java 😈"
          git push
