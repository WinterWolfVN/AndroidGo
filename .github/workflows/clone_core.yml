name: Tu Dong Lay Code Java Vao Repo

on:
  workflow_dispatch:

jobs:
  clone-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Buoc 1 - Checkout repo cua sep
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buoc 2 - Setup Git ca nhan
        run: |
          git config --global user.name "Github Action"
          git config --global user.email "actions@github.com"

      - name: Buoc 3 - Hut tron bo Core Java cua API 37
        run: |
          mkdir temp_sdk && cd temp_sdk
          git init
          git remote add -f origin https://github.com/AndroidSDKSources/android-sdk-sources-for-api-level-37.0.git
          git config core.sparseCheckout true
          
          # Kho vũ khí tối thượng của sếp
          echo "java/nio/" >> .git/info/sparse-checkout
          echo "java/time/" >> .git/info/sparse-checkout
          echo "java/security/" >> .git/info/sparse-checkout
          echo "java/io/" >> .git/info/sparse-checkout
          echo "java/util/" >> .git/info/sparse-checkout
          echo "java/lang/" >> .git/info/sparse-checkout
          echo "java/math/" >> .git/info/sparse-checkout
          echo "java/net/" >> .git/info/sparse-checkout
          
          git pull origin master
          cd ..

      - name: Buoc 4 - Dua thẳng vao thu muc java o goc repo của sếp
        run: |
          mkdir -p java
          
          # Chép sạch sẽ không thiếu một món
          cp -r temp_sdk/java/nio java/
          cp -r temp_sdk/java/time java/
          cp -r temp_sdk/java/security java/
          cp -r temp_sdk/java/io java/
          cp -r temp_sdk/java/util java/
          cp -r temp_sdk/java/lang java/
          cp -r temp_sdk/java/math java/
          cp -r temp_sdk/java/net java/
          
          rm -rf temp_sdk
          
          # Commit và đẩy thẳng lên GitHub cho sếp
          git add java/
          git commit -m "Pháp sư tối thượng: Hốt trọn bộ Core Java (nio, time, security, io, util, lang, math, net) API 37 😈"
          git push
